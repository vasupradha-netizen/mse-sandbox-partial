<template>
    <template lwc:if={ready}>
        <div id="header" style="font-size:18px; margin-bottom:10px;">
            <p>Click on any of the links below to view your dashboards.</p>
            <p>If you believe a dashboard is missing, please contact site support.</p>
        </div>
        <ul>
            <template for:each={settings} for:item="s">
                <li key={s.Id}>
                    <a data-id={s.Id} onclick={clickToNavigate} style="color:blue">{s.Name}</a>
                </li>
            </template>
        </ul>
</template>
